title: CCA-F Exam Notes
description: Exam-focused notes for Claude Certified Architect – Foundations
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Mermaid diagrams: write them in ```mermaid fenced blocks
mermaid:
  version: "10.9.1"

# Callouts: put {: .key } / {: .trap } / {: .tip } / {: .note } on the line above a paragraph
callouts:
  key:
    title: "🔑 Key Rule"
    color: blue
  trap:
    title: "⚠️ Exam Trap"
    color: red
  tip:
    title: "💡 Exam Tip"
    color: green
  note:
    title: "📝 Note"
    color: grey-dk

aux_links:
  "Anthropic Docs": "https://docs.claude.com"
  "Claude Code Docs": "https://code.claude.com/docs"

footer_content: "Study notes, not official Anthropic material. Check facts against the official exam guide."
