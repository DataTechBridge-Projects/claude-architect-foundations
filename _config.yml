title: Claude Certified Architect - Foundations (CCA-F) Study Guide
description: Self-directed exam-prep notes for the Claude Certified Architect - Foundations (CCA-F) certification, organized around the five-layer architecture framework.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true

nav_sort: case_insensitive
aux_links:
  "Anthropic Docs":
    - "https://platform.claude.com/docs/en/intro"

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Independent, self-directed exam-prep notes for the Claude Certified Architect - Foundations (CCA-F) certification. Not an official Anthropic resource."

callouts:
  exam-tip:
    title: Exam Tip
    color: blue
  key-term:
    title: Key Term
    color: green
  important:
    title: Important
    color: red

mermaid:
  version: "10.9.1"
